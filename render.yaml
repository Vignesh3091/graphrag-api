services:
  - type: web
    name: graphrag-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: NEO4J_URI
        value: YOUR_BOLT_URI_HERE
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: your_password
      - key: NEO4J_DB
        value: testrag2
